        <header class="header-top">
            <img src="../img/Adobe Express - file.jpg" alt="Logotipo agencia de plantas">

            </nav>
        </header>
    </div>

    <h2>Pronta para brilhar?<br>
        <span>fale conosco!</span>
    </h2>


    <form class="row g-3">

        <div class="md:col-6">
            <label for="inputEmail4" class="form-label">Email</label>
            <input type="email" class="form-control" id="inputEmail4">
        </div>
        <div class="md:col-6">
            <label for="inputPassword4" class="form-label">Nome Completo</label>
            <input type="NomeCompleto" class="form-control" id="inputPassword4">
        </div>
        <div class="col-12">
            <label for="inputAddress" class="form-label">Endereço</label>
            <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
        </div>
        <div class="col-12">
            <label for="inputAddress2" class="form-label">Complemento</label>
            <input type="text" class="form-control" id="inputAddress2" placeholder="Apartment, studio, or floor">
        </div>
        <div class="md:col-6">
            <label for="inputCity" class="form-label">Cidade</label>
            <input type="text" class="form-control" id="inputCity">
        </div>
        <div class="md:col-4">
            <label for="inputState" class="form-label">Interesse</label>
            <select id="inputState" class="form-control">
                <option selected>Planta Influencer</option>
                <option>Empresa de plantas</option>
                <option>Outro</option>
            </select>
        </div>
        <div class="md:col-2">
            <label for="inputZip" class="form-label">Telefone</label>
            <input type="text" class="form-control" id="inputZip">
        </div>
        <div class="col-12">
            <div class="form-field">
                <input type="checkbox" id="gridCheck" class="check">
                <label for="gridCheck">
                    Concordo com os termos.
                </label>
            </div>
        </div>
        <div class="col-12">
            <button type="submit" class="btn-solid theme-primary">Cadastre-se</button>
        </div>
    </form>
